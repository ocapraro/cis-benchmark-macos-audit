<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="./css/styles.css">
  <script src="./js/config.js"></script>
  <script src="./js/scripts.js"></script>
  <title>CIS Benchmark Dashboard</title>
</head>
<body>
  <header>
    <h1>CIS Benchmark Dashboard</h1>
    <div class="subtitle">How secure is your Red Hat box?</div>
  </header>
  <main>
    <section id="actions">
      <button id="run-all-checks" class="action-button primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        Run All Checks
      </button>
      <button id="run-all-fixes" class="action-button secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Fix All Failed/Error Tests
      </button>
    </section>
    <section id="status">
      <div class="status-card" id="passed-tests">
        <div class="info">
          <div class="title">Passed Tests</div>
          <div class="number">...</div>
        </div>
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-check-big w-12 h-12 text-green-500 opacity-20"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="m9 11 3 3L22 4"></path></svg>
        </div>
      </div>
      <div class="status-card" id="failed-tests">
        <div class="info">
          <div class="title">Failed Tests</div>
          <div class="number">...</div>
        </div>
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x w-12 h-12 text-red-500 opacity-20"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>
        </div>
      </div>
      <div class="status-card" id="error-tests">
        <div class="info">
          <div class="title">Error Tests</div>
          <div class="number">...</div>
        </div>
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-alert w-12 h-12 text-amber-500 opacity-20"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
        </div>
      </div>
    </section>
    <section>
      <div id="results">
        <h2 class="title">Test Results</h2>
      </div>
    </section>
  </main>
</body>
</html>
